<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شفاء - الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
 <main class="pg">
  <div class="top"><b>الإدارة</b></div>
  <div class="tabs" id="tabs"></div>
  <div id="files"></div>
 </main>
 <nav id="nav"></nav>
 <div id="toast"></div>
</div>
<script>window.NEED_ADMIN=true</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
nav('admin');
var tab='p';

function draw(){
  var T=[['p','بانتظار الموافقة'],['a','المقبولة'],['r','المرفوضة']];
  $('tabs').innerHTML=T.map(function(t){
    return '<button class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';draw()">'+t[1]+'</button>';
  }).join('');
  var f=S.files.filter(function(x){return x.st===tab});
  $('files').innerHTML=f.length?f.map(function(x){
    var b='<div class="row">'
      +(x.st==='p'?'<button class="btn g" onclick="decide('+x.id+',\'a\')">موافق</button><button class="btn r" onclick="decide('+x.id+',\'r\')">رفض</button>':'')
      +'<button class="btn r" onclick="del('+x.id+')">حذف</button></div>';
    return '<div class="file"><b class="fl" style="cursor:pointer" onclick="openFile(\''+x.path+'\')">'+ic('clip')+'ملف: '+x.name+'</b><small>من: '+x.from+' • '+x.type+'</small>'+b+'</div>';
  }).join(''):'<div class="empty">لا توجد ملفات هنا</div>';
}
async function decide(id,st){
  if(await setStatus(id,st)){draw();toast(st==='a'?'تمت الموافقة':'تم الرفض')}
}
async function del(id){
  var f=S.files.filter(function(x){return x.id===id})[0];
  if(!f)return;
  if(!confirm('حذف هذا الملف نهائياً؟ لا يمكن التراجع.'))return;
  if(f.path){
    var r=await sb.storage.from('pdfs').remove([f.path]);
    if(r.error||!r.data||!r.data.length){toast('تعذر حذف الملف من التخزين');return}
  }
  var d=await sb.from('uploads').delete().eq('id',id);
  if(d.error){toast('تعذر الحذف');return}
  await loadFiles();draw();toast('تم الحذف');
}
READY.then(function(u){if(u)draw()});
</script>
</body>
</html>
